<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-labelledby="title">
  <title id="title">Daily Tracker notification</title>

  <!--
    Source for the status bar icon. Android keeps only the alpha and tints the rest, so the
    colour below is a placeholder. Every tile edge is a whole unit of the 24 grid, which is
    pixel aligned at every density except hdpi.

    No panel border. A one unit stroke is thinner than a pixel at the size a status bar
    draws, and it crowds the gaps between the tiles it surrounds.

    Cells are 6 wide with 1 between them, inside a margin of 2. With every edge on a whole
    unit and equal margins on both sides, 6 is as large as a three by three grid gets.

    Kept in step with app/src/main/res/drawable/ic_notification.xml.
  -->
  <g fill="#1b1b1d" stroke="#1b1b1d">
    <!-- Filled: green in the colour icon -->
    <path stroke="none" d="M3.4,2 L6.6,2 A1.4,1.4 0 0 1 8,3.4 L8,6.6 A1.4,1.4 0 0 1 6.6,8 L3.4,8 A1.4,1.4 0 0 1 2,6.6 L2,3.4 A1.4,1.4 0 0 1 3.4,2 Z"/>
    <path stroke="none" d="M3.4,9 L6.6,9 A1.4,1.4 0 0 1 8,10.4 L8,13.6 A1.4,1.4 0 0 1 6.6,15 L3.4,15 A1.4,1.4 0 0 1 2,13.6 L2,10.4 A1.4,1.4 0 0 1 3.4,9 Z"/>
    <path stroke="none" d="M3.4,16 L6.6,16 A1.4,1.4 0 0 1 8,17.4 L8,20.6 A1.4,1.4 0 0 1 6.6,22 L3.4,22 A1.4,1.4 0 0 1 2,20.6 L2,17.4 A1.4,1.4 0 0 1 3.4,16 Z"/>
    <path stroke="none" d="M10.4,16 L13.6,16 A1.4,1.4 0 0 1 15,17.4 L15,20.6 A1.4,1.4 0 0 1 13.6,22 L10.4,22 A1.4,1.4 0 0 1 9,20.6 L9,17.4 A1.4,1.4 0 0 1 10.4,16 Z"/>

    <!-- Outlined: yellow in the colour icon -->
    <path fill="none" stroke-width="1"
          d="M10.4,9.5 L13.6,9.5 A0.9,0.9 0 0 1 14.5,10.4 L14.5,13.6 A0.9,0.9 0 0 1 13.6,14.5 L10.4,14.5 A0.9,0.9 0 0 1 9.5,13.6 L9.5,10.4 A0.9,0.9 0 0 1 10.4,9.5 Z"/>
    <path fill="none" stroke-width="1"
          d="M17.4,16.5 L20.6,16.5 A0.9,0.9 0 0 1 21.5,17.4 L21.5,20.6 A0.9,0.9 0 0 1 20.6,21.5 L17.4,21.5 A0.9,0.9 0 0 1 16.5,20.6 L16.5,17.4 A0.9,0.9 0 0 1 17.4,16.5 Z"/>
  </g>
</svg>
