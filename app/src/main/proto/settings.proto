syntax = "proto3";

option java_package = "org.shawnz.dailytracker.data";
option java_multiple_files = true;

enum ReminderModeProto {
  REMINDER_MODE_UNSPECIFIED = 0;
  REMINDER_MODE_FIXED_TIME = 1;
  REMINDER_MODE_BEFORE_RESET = 2;
}

message StoredSettings {
  optional bool reminders_enabled = 1;

  // The second of day.
  optional int32 reminder_time = 2;

  ReminderModeProto reminder_mode = 3;

  optional int32 reminder_lead_time_seconds = 4;
}
